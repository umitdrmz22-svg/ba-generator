name: EHS Android QA3
permissions: { contents: read }
on: { push: { branches: ["main"] }, workflow_dispatch: {} }
concurrency:
  group: ehs-mobile-qa3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v4
      - run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: "8.13" }
      - name: Unit lint build gate
        working-directory: mobile-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Functional traversal x3
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            APK=mobile-android/app/build/outputs/apk/debug/app-debug.apk
            test -s "$APK"
            adb install -r "$APK"
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
            PKG=$($AAPT dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p")
            test -n "$PKG"
            mkdir -p ehs-mobile-qa3-logs
            for SEED in 101 202 303; do
              adb shell pm clear "$PKG" >/dev/null
              adb logcat -c
              adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null
              sleep 1
              adb shell monkey -p "$PKG" --throttle 70 -s "$SEED" -v 400 >"ehs-mobile-qa3-logs/monkey-$SEED.txt" 2>&1 || true
              sleep 2
              adb logcat -b all -d -v threadtime >"ehs-mobile-qa3-logs/logcat-$SEED.txt"
              if grep -q "ANR in $PKG" "ehs-mobile-qa3-logs/logcat-$SEED.txt"; then echo "ANR on seed $SEED"; exit 1; fi
              if grep -A20 -B5 "FATAL EXCEPTION" "ehs-mobile-qa3-logs/logcat-$SEED.txt" | grep -Fq "$PKG"; then echo "Crash on seed $SEED"; exit 1; fi
            done
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: ehs-mobile-qa3-logs, path: ehs-mobile-qa3-logs, if-no-files-found: warn }
