name: Sync EHS company admin redirect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-company-admin-redirect.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Patch invitation redirect
        run: |
          set -euo pipefail
          FILE=supabase/functions/ehs-company-admin/index.ts
          grep -Fq 'https://umitdrmz22-svg.github.io/defidev-legal/ehs-online.html' "$FILE"
          sed -i 's#https://umitdrmz22-svg.github.io/defidev-legal/ehs-online.html#https://umitdrmz22-svg.github.io/defidev-legal/ehs-company-admin.html#g' "$FILE"
          grep -Fq 'https://umitdrmz22-svg.github.io/defidev-legal/ehs-company-admin.html' "$FILE"
          ! grep -Fq 'https://umitdrmz22-svg.github.io/defidev-legal/ehs-online.html' "$FILE"
      - name: Commit source sync
        run: |
          git config user.name 'DefiDev Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/ehs-company-admin/index.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Send EHS invitations to company admin portal'
          git push
