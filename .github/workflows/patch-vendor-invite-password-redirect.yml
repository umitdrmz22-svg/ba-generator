name: One-time vendor invite password redirect patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-vendor-invite-password-redirect.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch vendor owner invitation redirect
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/ehs-vendor-admin/index.ts')
          s=p.read_text()
          old="https://umitdrmz22-svg.github.io/defidev-legal/ehs-company-admin.html"
          new="https://umitdrmz22-svg.github.io/defidev-legal/ehs-set-password.html"
          if old not in s:
              raise SystemExit('old vendor redirect not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -Fq 'ehs-set-password.html' supabase/functions/ehs-vendor-admin/index.ts
      - name: Commit source and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/ehs-vendor-admin/index.ts
          git rm .github/workflows/patch-vendor-invite-password-redirect.yml
          git commit -m 'Route vendor owner invites through password setup'
          git push