name: Finalize DefiDev EHS mobile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-ehs-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Apply compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('mobile-android/app/src/main/java/com/defidev/ehs/MainActivity.kt')
          s = p.read_text()
          s = s.replace('import androidx.activity.BackHandler\n', '')
          s = s.replace('import androidx.activity.compose.BackHandler\n', '')
          s = re.sub(r'\n\s*BackHandler\s*\{\s*val view = webView\s*if \(view\?\.canGoBack\(\) == true\) view\.goBack\(\) else onBack\(\)\s*\}\s*', '\n', s, flags=re.S)
          s = s.replace('onPurchase = { purchase ->\n                val active = session ?: return@BillingManager', 'onPurchase = purchaseHandler@{ purchase ->\n                val active = session ?: return@purchaseHandler')
          p.write_text(s)
          PY
          grep -n "BackHandler" mobile-android/app/src/main/java/com/defidev/ehs/MainActivity.kt && exit 1 || true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Full release gate
        working-directory: mobile-android
        run: |
          gradle --no-daemon :app:testDebugUnitTest
          gradle --no-daemon :app:lintDebug
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon :app:bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Commit only after green gate
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "DefiDev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mobile-android/app/src/main/java/com/defidev/ehs/MainActivity.kt
          git commit -m "Finalize DefiDev EHS Android compatibility"
          git push
