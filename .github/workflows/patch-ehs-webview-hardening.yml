name: One-time EHS WebView hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ehs-webview-hardening.yml'
      - 'tools/patch_ehs_webview.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply patch
        run: python3 tools/patch_ehs_webview.py
      - name: Commit patch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mobile-android/app/src/main/java/com/defidev/ehs/MainActivity.kt
          git commit -m "Harden EHS module WebView navigation" || exit 0
          git push
