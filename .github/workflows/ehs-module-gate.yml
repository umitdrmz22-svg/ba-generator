name: Gate BA Studio by EHS subscription
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ehs-module-gate.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inject entitlement gate
        env:
          PRODUCT_ID: ehs_ba_monthly
          MODULE_TITLE: BA Studio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          candidates=[Path('index.html'),Path('public/index.html'),Path('docs/index.html')]
          p=next((x for x in candidates if x.exists()),None)
          if not p: raise SystemExit('No published index.html found')
          s=p.read_text()
          marker='defidev-legal/ehs-entitlement-gate.js'
          if marker not in s:
              tag=f'<script src="https://umitdrmz22-svg.github.io/defidev-legal/ehs-entitlement-gate.js" data-product-id="{os.environ["PRODUCT_ID"]}" data-module-title="{os.environ["MODULE_TITLE"]}"></script>\n'
              if '</head>' not in s: raise SystemExit('No </head> marker')
              s=s.replace('</head>',tag+'</head>',1)
              p.write_text(s)
          print(p)
          PY
          grep -R -n "ehs_ba_monthly" index.html public/index.html docs/index.html 2>/dev/null | head -1
      - name: Commit gate
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "DefiDev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html public/index.html docs/index.html 2>/dev/null || true
          git commit -m "Require BA Studio module subscription"
          git push
