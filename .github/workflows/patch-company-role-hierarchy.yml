name: One-time company role hierarchy hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-company-role-hierarchy.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Harden privileged role operations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/ehs-company-admin/index.ts')
          s=p.read_text()
          old="if((seatType==='editor')!==EDITOR_ROLES.has(role))return json({error:'ROLE_SEAT_MISMATCH'},400);const activeBilling="
          new="if((seatType==='editor')!==EDITOR_ROLES.has(role))return json({error:'ROLE_SEAT_MISMATCH'},400);if(['owner','admin'].includes(role)&&callerAdmin.role!=='owner')return json({error:'FORBIDDEN_ROLE_GRANT'},403);const activeBilling="
          if old not in s: raise SystemExit('invite hierarchy marker not found')
          s=s.replace(old,new,1)

          old="if(action==='revokeInvite'){const inviteId=String(body.inviteId??'').trim();if(!inviteId)return json({error:'INVITE_REQUIRED'},400);const{data,error}=await admin.from('ehs_werk_invites').update({status:'revoked',updated_at:new Date().toISOString()})"
          new="if(action==='revokeInvite'){const inviteId=String(body.inviteId??'').trim();if(!inviteId)return json({error:'INVITE_REQUIRED'},400);const{data:targetInvite,error:targetInviteError}=await admin.from('ehs_werk_invites').select('id,role').eq('id',inviteId).eq('company_id',companyId).eq('werk_id',werkId).eq('status','pending').maybeSingle();if(targetInviteError)return json({error:'INVITE_QUERY_FAILED'},500);if(!targetInvite)return json({error:'INVITE_NOT_FOUND'},404);if(['owner','admin'].includes(String(targetInvite.role))&&callerAdmin.role!=='owner')return json({error:'FORBIDDEN_PRIVILEGED_TARGET'},403);const{data,error}=await admin.from('ehs_werk_invites').update({status:'revoked',updated_at:new Date().toISOString()})"
          if old not in s: raise SystemExit('revoke hierarchy marker not found')
          s=s.replace(old,new,1)

          old="if(action==='removeMember'){const memberUserId=String(body.userId??'').trim();if(!memberUserId)return json({error:'USER_REQUIRED'},400);if(memberUserId===user.id&&callerAdmin.role==='owner')return json({error:'OWNER_SELF_REMOVE_BLOCKED'},409);const{data,error}=await admin.from('ehs_werk_members').delete()"
          new="if(action==='removeMember'){const memberUserId=String(body.userId??'').trim();if(!memberUserId)return json({error:'USER_REQUIRED'},400);if(memberUserId===user.id&&callerAdmin.role==='owner')return json({error:'OWNER_SELF_REMOVE_BLOCKED'},409);const{data:targetMember,error:targetMemberError}=await admin.from('ehs_werk_members').select('role,seat_type,status').eq('werk_id',werkId).eq('user_id',memberUserId).maybeSingle();if(targetMemberError)return json({error:'MEMBER_QUERY_FAILED'},500);if(!targetMember)return json({error:'MEMBER_NOT_FOUND'},404);if(['owner','admin'].includes(String(targetMember.role))&&callerAdmin.role!=='owner')return json({error:'FORBIDDEN_PRIVILEGED_TARGET'},403);const{data,error}=await admin.from('ehs_werk_members').delete()"
          if old not in s: raise SystemExit('member hierarchy marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -Fq 'FORBIDDEN_ROLE_GRANT' supabase/functions/ehs-company-admin/index.ts
          grep -Fq 'FORBIDDEN_PRIVILEGED_TARGET' supabase/functions/ehs-company-admin/index.ts
          grep -Fq "targetMember.role" supabase/functions/ehs-company-admin/index.ts
          grep -Fq "targetInvite.role" supabase/functions/ehs-company-admin/index.ts
      - name: Commit source and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/ehs-company-admin/index.ts
          git rm .github/workflows/patch-company-role-hierarchy.yml
          git commit -m 'Enforce company role hierarchy server-side'
          git push