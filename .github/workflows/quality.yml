name: Qualitätsprüfung

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  qa3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript-Syntax prüfen
        run: |
          for file in assets/auth-config.js assets/auth-client.js assets/ba-cloud.js assets/engine.js assets/app.js; do node --check "$file"; done
      - name: Werk- und Lizenzisolierung prüfen
        run: |
          grep -Fq 'origin_werk_id:originWerkId' assets/ba-cloud.js
          grep -Fq ".eq('origin_werk_id',originWerkId)" assets/ba-cloud.js
          grep -Fq 'selectedWerk' assets/ba-cloud.js
          test -f .github/workflows/ehs-module-gate.yml
          grep -Fq 'defidev-legal/ehs-entitlement-gate.js' .github/workflows/ehs-module-gate.yml
          grep -Fq 'ehs_ba_monthly' .github/workflows/ehs-module-gate.yml
      - name: Corporate security source contract
        run: |
          for file in \
            supabase/056_ehs_company_sales_invites_and_audit.sql \
            supabase/057_ehs_atomic_invite_seat_reservations.sql \
            supabase/058_ehs_explicit_server_only_deny_policies.sql \
            supabase/059_ehs_module_werk_rls_isolation.sql \
            supabase/060_ehs_unfall_action_werk_rls.sql \
            supabase/061_ehs_private_rls_helper_functions.sql \
            supabase/062_ehs_lock_unused_server_tables.sql \
            supabase/063_ehs_vendor_provisioning_foundation.sql \
            supabase/064_ehs_prevent_license_seat_underflow.sql \
            supabase/065_ehs_sync_company_admin_from_werk_owner.sql \
            supabase/066_ehs_account_deletion_preserve_company_records.sql \
            supabase/067_ehs_personal_account_cleanup_rpc.sql \
            supabase/functions/ehs-company-admin/index.ts \
            supabase/functions/ehs-vendor-admin/index.ts \
            supabase/functions/delete-my-account/index.ts; do
            test -s "$file"
          done
          grep -Fq 'ehs_has_module_werk_access' supabase/059_ehs_module_werk_rls_isolation.sql
          grep -Fq 'SEAT_LIMIT_REACHED' supabase/functions/ehs-company-admin/index.ts
          grep -Fq 'ehs_company_audit_log' supabase/functions/ehs-company-admin/index.ts
          grep -Fq 'auditEvents' supabase/functions/ehs-company-admin/index.ts
          grep -Fq 'email_confirmed_at' supabase/functions/ehs-company-admin/index.ts
          grep -Fq 'VERIFIED_EMAIL_REQUIRED' supabase/functions/ehs-company-admin/index.ts
          grep -Fq 'ehs-set-password.html' supabase/functions/ehs-company-admin/index.ts
          grep -Fq 'email_confirmed_at' supabase/functions/ehs-vendor-admin/index.ts
          grep -Fq 'ehs_vendor_audit_log' supabase/functions/ehs-vendor-admin/index.ts
          grep -Fq 'ehs-set-password.html' supabase/functions/ehs-vendor-admin/index.ts
          grep -Fq 'nextMonthlyPeriodEnd' supabase/functions/ehs-vendor-admin/index.ts
          ! grep -Fq 'end.setMonth(end.getMonth()+1)' supabase/functions/ehs-vendor-admin/index.ts
          grep -Fq 'on delete set null' supabase/066_ehs_account_deletion_preserve_company_records.sql
          grep -Fq 'revoke all on function public.ehs_cleanup_personal_account_data' supabase/067_ehs_personal_account_cleanup_rpc.sql
          grep -Fq "admin.auth.admin.signOut(accessToken, 'global')" supabase/functions/delete-my-account/index.ts
          grep -Fq 'corporateRecordsPreserved' supabase/functions/delete-my-account/index.ts
          ! grep -R -Fq 'SUPABASE_SERVICE_ROLE_KEY' assets mobile-android/app/src/main || false
      - name: Engine/UI Tests dreimal ausführen
        run: |
          for PASS in 1 2 3; do echo "QA pass $PASS"; node tests/engine.test.js; node tests/ui-extension.test.js; done