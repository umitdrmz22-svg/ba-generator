name: One-time WebView debug compile fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-webview-debug.yml'
      - 'tools/fix_webview_debug.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/fix_webview_debug.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mobile-android/app/src/main/java/com/defidev/ehs/MainActivity.kt
          git commit -m "Fix EHS WebView debug flag" || exit 0
          git push
