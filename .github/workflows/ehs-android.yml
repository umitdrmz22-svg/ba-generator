name: DefiDev EHS Android

on:
  push:
    branches: [main]
    paths:
      - 'mobile-android/**'
      - '.github/workflows/ehs-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile-android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Lint
        run: gradle --no-daemon :app:lintDebug
      - name: Debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Release bundle structure
        run: gradle --no-daemon :app:bundleRelease
      - name: Verify target SDK and restricted permissions
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          if grep -R "android.permission.CAMERA\|android.permission.RECORD_AUDIO\|android.permission.ACCESS_FINE_LOCATION\|android.permission.ACCESS_COARSE_LOCATION\|com.google.android.gms.permission.AD_ID" -n app/src/main/AndroidManifest.xml; then
            echo "Unexpected sensitive permission in DefiDev EHS mobile shell" >&2
            exit 1
          fi
