name: Apply EHS corporate mobile licensing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ehs-corporate-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Integrate unified personal and corporate entitlements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('mobile-android/app/src/main/java/com/defidev/ehs/MainActivity.kt')
          s = p.read_text()

          old = '''private data class Entitlement(
              val productId: String,
              val active: Boolean,
              val status: String,
              val expiresAt: String?,
          )'''
          new = '''private data class Entitlement(
              val productId: String,
              val active: Boolean,
              val status: String,
              val expiresAt: String?,
              val mode: String = "edit",
              val sources: List<String> = emptyList(),
              val works: List<String> = emptyList(),
          )'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'val sources: List<String> = emptyList()' not in s:
              raise SystemExit('Entitlement data class pattern not found')

          old = '''                    if (verified != null) {
                                  entitlements = entitlements + (verified.productId to verified)
                                  val moduleTitle = modules.firstOrNull { it.productId == verified.productId }?.title ?: "EHS"
                                  message = if (verified.active) "$moduleTitle wurde freigeschaltet." else "Abonnementstatus wurde aktualisiert."
                              } else {'''
          new = '''                    if (verified != null) {
                                  entitlements = SupabaseApi.getEntitlements(activeSession)
                                  val moduleTitle = modules.firstOrNull { it.productId == verified.productId }?.title ?: "EHS"
                                  message = if (verified.active) "$moduleTitle wurde freigeschaltet." else "Abonnementstatus wurde aktualisiert."
                              } else {'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'entitlements = SupabaseApi.getEntitlements(activeSession)' not in s:
              raise SystemExit('Purchase handler pattern not found')

          s = s.replace('Text("EHS-Module einzeln abonnieren", color = MaterialTheme.colorScheme.onSurfaceVariant)',
                        'Text("Einzelabo oder Firmen-/Werk-Lizenz", color = MaterialTheme.colorScheme.onSurfaceVariant)', 1)
          s = s.replace('val legacyAccess = entitlements[LEGACY_ALL_ACCESS_PRODUCT]?.active == true',
                        'val legacyAccess = entitlements.values.any { "legacy_all_access" in it.sources }', 1)

          active_pattern = re.compile(r'''(?P<indent>\s+)Text\(\s*\n\s*entitlement\?\.expiresAt\?\.let \{ "Abo aktiv bis \$it" \} \?: "Monatsabo aktiv",\s*\n\s*style = MaterialTheme\.typography\.bodySmall,\s*\n\s*\)''')
          def active_repl(m):
              i = m.group('indent')
              return f'''{i}val accessText = when {{
          {i}    entitlement == null -> "Lizenz aktiv"
          {i}    "corporate_werk" in entitlement.sources && entitlement.mode == "read" ->
          {i}        "Firmenlizenz · Leser${{entitlement.works.firstOrNull()?.let {{ " · $it" }} ?: ""}}"
          {i}    "corporate_werk" in entitlement.sources ->
          {i}        "Firmenlizenz · Bearbeiter${{entitlement.works.firstOrNull()?.let {{ " · $it" }} ?: ""}}"
          {i}    "legacy_all_access" in entitlement.sources -> "Legacy EHS Pro"
          {i}    entitlement.expiresAt != null -> "Google-Play-Abo aktiv bis ${{entitlement.expiresAt}}"
          {i}    else -> "Google-Play-Monatsabo aktiv"
          {i}}}
          {i}Text(accessText, style = MaterialTheme.typography.bodySmall)'''
          s, count = active_pattern.subn(active_repl, s, count=1)
          if count == 0 and 'val accessText = when {' not in s:
              raise SystemExit('Dashboard active-license block not found')

          account_pattern = re.compile(r'''(?P<indent>\s+)activeModules\.forEach \{ module ->\s*\n\s*Text\("• \$\{module\.title\}", style = MaterialTheme\.typography\.bodySmall\)\s*\n\s*\}''')
          def account_repl(m):
              i = m.group('indent')
              return f'''{i}activeModules.forEach {{ module ->
          {i}    val access = entitlements[module.productId]
          {i}    val suffix = when {{
          {i}        access == null -> ""
          {i}        "corporate_werk" in access.sources && access.mode == "read" -> " · Firmenlizenz / Leser"
          {i}        "corporate_werk" in access.sources -> " · Firmenlizenz / Bearbeiter"
          {i}        else -> " · Google Play"
          {i}    }}
          {i}    Text("• ${{module.title}}$suffix", style = MaterialTheme.typography.bodySmall)
          {i}}}'''
          s, count = account_pattern.subn(account_repl, s, count=1)
          if count == 0 and 'Firmenlizenz / Leser' not in s:
              raise SystemExit('Account active-module block not found')

          pattern = re.compile(r'''    suspend fun getEntitlements\(session: Session\): Map<String, Entitlement> = withContext\(Dispatchers.IO\) \{.*?\n    \}\n\n    suspend fun verifyPurchase''', re.S)
          replacement = '''    suspend fun getEntitlements(session: Session): Map<String, Entitlement> = withContext(Dispatchers.IO) {
              val response = request(
                  "$SUPABASE_URL/functions/v1/get-ehs-entitlements",
                  "GET",
                  null,
                  session.accessToken,
              )
              if (response.first !in 200..299) return@withContext emptyMap()
              val root = runCatching { JSONObject(response.second) }.getOrNull() ?: return@withContext emptyMap()
              val rows = root.optJSONArray("modules") ?: return@withContext emptyMap()
              buildMap {
                  for (index in 0 until rows.length()) {
                      val row = rows.optJSONObject(index) ?: continue
                      val productId = row.optString("productId")
                      if (productId !in sellableProductIds) continue
                      val sourcesArray = row.optJSONArray("sources") ?: JSONArray()
                      val sources = buildList {
                          for (i in 0 until sourcesArray.length()) add(sourcesArray.optString(i))
                      }.filter { it.isNotBlank() }
                      val worksArray = row.optJSONArray("works") ?: JSONArray()
                      val works = buildList {
                          for (i in 0 until worksArray.length()) {
                              val werk = worksArray.optJSONObject(i) ?: continue
                              val name = werk.optString("name")
                              val code = werk.optString("code")
                              val label = if (code.isNotBlank()) "$name ($code)" else name
                              if (label.isNotBlank()) add(label)
                          }
                      }
                      val active = row.optBoolean("active", false)
                      val expiresAt = row.optString("expiresAt").takeIf { it.isNotBlank() && it != "null" }
                      put(
                          productId,
                          Entitlement(
                              productId = productId,
                              active = active,
                              status = if (active) "active" else "none",
                              expiresAt = expiresAt,
                              mode = row.optString("mode", if (active) "edit" else "none"),
                              sources = sources,
                              works = works,
                          ),
                      )
                  }
              }
          }

          suspend fun verifyPurchase'''
          if '/functions/v1/get-ehs-entitlements' not in s:
              s2, n = pattern.subn(replacement, s, count=1)
              if n != 1:
                  raise SystemExit(f'getEntitlements replacement count={n}')
              s = s2

          p.write_text(s)
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Full Android gate
        working-directory: mobile-android
        run: |
          gradle --no-daemon :app:testDebugUnitTest
          gradle --no-daemon :app:lintDebug
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon :app:bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Commit after green build
        run: |
          git config user.name "DefiDev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mobile-android/app/src/main/java/com/defidev/ehs/MainActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use corporate Werk entitlements in EHS Android"
          git push
