name: Apply EHS corporate mobile licensing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ehs-corporate-mobile.yml'
      - 'tools/patch_ehs_corporate_android.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Apply corporate entitlement patch
        run: python3 tools/patch_ehs_corporate_android.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Full Android gate
        working-directory: mobile-android
        run: |
          gradle --no-daemon :app:testDebugUnitTest
          gradle --no-daemon :app:lintDebug
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon :app:bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Commit after green build
        run: |
          git config user.name "DefiDev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mobile-android/app/src/main/java/com/defidev/ehs/MainActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use corporate Werk entitlements in EHS Android"
          git push
